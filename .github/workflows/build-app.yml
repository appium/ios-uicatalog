name: Build App (Reusable)

on:
  workflow_call:
    inputs:
      upload_release_artifacts:
        description: 'Whether to upload build artifacts to a release'
        required: false
        type: boolean
        default: false
      upload_pr_artifacts:
        description: 'Whether to upload build artifacts as GitHub Actions artifacts'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag name for artifact upload'
        required: false
        type: string
        default: ''
      checkout_ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      run_lint:
        description: 'Whether to run lint'
        required: false
        type: boolean
        default: false

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        if: inputs.run_lint == true
        run: npm run lint

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Clean build directory
        run: rm -rf UIKitCatalog/build

      - name: Build iOS App for Simulator
        run: npm run build

      - name: Create ZIP archive
        run: |
          cwd=$(pwd)
          cd UIKitCatalog/build/Release-iphonesimulator
          zip -r "${cwd}/UIKitCatalog-iphonesimulator.zip" UIKitCatalog-iphonesimulator.app

      - name: Upload iOS App as Artifact
        if: inputs.upload_pr_artifacts == true
        uses: actions/upload-artifact@v5
        with:
          name: UIKitCatalog-iphonesimulator.zip
          path: UIKitCatalog-iphonesimulator.zip
          retention-days: 7

      - name: Upload iOS App to Release
        if: inputs.upload_release_artifacts == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            UIKitCatalog-iphonesimulator.zip
          token: ${{ secrets.GITHUB_TOKEN }}

